name: Feature request
description: Suggest a focused improvement to the plugin, installer, CLI, or docs.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user problem, not only the proposed code change.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer
        - Hooks
        - Rules
        - Skills
        - Memory
        - CLI
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request keeps the verified-recovery rule intact.
          required: true
        - label: I searched existing issues and discussions.
          required: true
