[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-harness"
version = "1.0.0"
description = "Harness²: Recursive Agent Harnessing for Antigravity (Google Research Harness² adaptation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Antigravity Team & Harness Community" }
]
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "plugin*"]
